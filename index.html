<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ConstitúyeteRD - Constitución de Empresas en República Dominicana</title>
  <meta name="description" content="Constituye tu SRL o EIRL en República Dominicana de forma rápida y segura. Asesoría legal y fiscal integral con el respaldo de Anchi Advisors.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, sans-serif;
    }

    body {
      background-color: #f8fafc;
      color: #0f172a;
      line-height: 1.6;
    }

    /* Header */
    header {
      background: #ffffff;
      border-bottom: 1px solid #e2e8f0;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .header-container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 1rem 1.5rem;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .logo {
      display: flex;
      flex-direction: column;
      text-decoration: none;
    }

    .logo-main {
      font-size: 1.5rem;
      font-weight: 800;
      color: #0284c7;
      letter-spacing: -0.5px;
    }

    .logo-sub {
      font-size: 0.75rem;
      color: #64748b;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .btn-header {
      background-color: #25d366;
      color: #ffffff;
      font-weight: 700;
      padding: 0.6rem 1.2rem;
      border-radius: 9999px;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      transition: all 0.2s ease;
      font-size: 0.9rem;
      box-shadow: 0 4px 6px -1px rgba(37, 211, 102, 0.2);
    }

    .btn-header:hover {
      background-color: #22c55e;
      transform: translateY(-1px);
    }

    /* Hero Section */
    .hero {
      background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
      color: #ffffff;
      padding: 4rem 1.5rem;
      text-align: center;
    }

    .hero-container {
      max-width: 900px;
      margin: 0 auto;
    }

    .badge {
      display: inline-block;
      background: rgba(56, 189, 248, 0.1);
      color: #38bdf8;
      border: 1px solid rgba(56, 189, 248, 0.2);
      padding: 0.4rem 1rem;
      border-radius: 9999px;
      font-size: 0.85rem;
      font-weight: 600;
      margin-bottom: 1.5rem;
    }

    .hero h1 {
      font-size: 2.25rem;
      font-weight: 800;
      line-height: 1.2;
      margin-bottom: 1.25rem;
      letter-spacing: -0.5px;
    }

    .hero h1 span {
      color: #38bdf8;
    }

    .hero p {
      font-size: 1.1rem;
      color: #94a3b8;
      margin-bottom: 2rem;
      max-width: 750px;
      margin-left: auto;
      margin-right: auto;
    }

    .cta-group {
      display: flex;
      flex-direction: column;
      gap: 1rem;
      align-items: center;
      justify-content: center;
    }

    @media(min-width: 640px) {
      .hero h1 { font-size: 3.25rem; }
      .cta-group { flex-direction: row; }
    }

    .btn-primary {
      background-color: #25d366;
      color: #ffffff;
      font-size: 1.1rem;
      font-weight: 700;
      padding: 1rem 2rem;
      border-radius: 0.75rem;
      text-decoration: none;
      display: inline-flex;
      align-items: center;
      gap: 0.75rem;
      transition: all 0.2s ease;
      box-shadow: 0 10px 15px -3px rgba(37, 211, 102, 0.3);
      width: 100%;
      justify-content: center;
    }

    @media(min-width: 640px) {
      .btn-primary { width: auto; }
    }

    .btn-primary:hover {
      background-color: #22c55e;
      transform: translateY(-2px);
    }

    /* Benefits */
    .features {
      padding: 4rem 1.5rem;
      max-width: 1200px;
      margin: 0 auto;
    }

    .section-title {
      text-align: center;
      margin-bottom: 3rem;
    }

    .section-title h2 {
      font-size: 2rem;
      font-weight: 800;
      color: #0f172a;
    }

    .section-title p {
      color: #64748b;
      margin-top: 0.5rem;
    }

    .grid-3 {
      display: grid;
      grid-template-columns: 1fr;
      gap: 1.5rem;
    }

    @media(min-width: 768px) {
      .grid-3 { grid-template-columns: repeat(3, 1fr); }
    }

    .card {
      background: #ffffff;
      border: 1px solid #e2e8f0;
      border-radius: 1rem;
      padding: 2rem;
      transition: all 0.2s ease;
    }

    .card:hover {
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.05);
      border-color: #cbd5e1;
    }

    .card-icon {
      width: 3rem;
      height: 3rem;
      background: #e0f2fe;
      color: #0284c7;
      border-radius: 0.75rem;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.5rem;
      margin-bottom: 1.25rem;
    }

    .card h3 {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 0.5rem;
    }

    .card p {
      color: #64748b;
      font-size: 0.95rem;
    }

    /* Packages */
    .packages {
      background: #f1f5f9;
      padding: 4rem 1.5rem;
    }

    .packages-container {
      max-width: 1000px;
      margin: 0 auto;
    }

    .grid-2 {
      display: grid;
      grid-template-columns: 1fr;
      gap: 2rem;
    }

    @media(min-width: 768px) {
      .grid-2 { grid-template-columns: repeat(2, 1fr); }
    }

    .pkg-card {
      background: #ffffff;
      border-radius: 1.25rem;
      padding: 2.5rem;
      border: 2px solid #e2e8f0;
      position: relative;
      display: flex;
      flex-direction: column;
    }

    .pkg-card.featured {
      border-color: #0284c7;
      box-shadow: 0 20px 25px -5px rgba(2, 132, 199, 0.1);
    }

    .pkg-tag {
      position: absolute;
      top: -12px;
      right: 24px;
      background: #0284c7;
      color: #ffffff;
      font-size: 0.75rem;
      font-weight: 700;
      padding: 0.25rem 0.75rem;
      border-radius: 9999px;
      text-transform: uppercase;
    }

    .pkg-title {
      font-size: 1.5rem;
      font-weight: 800;
      margin-bottom: 0.5rem;
    }

    .pkg-subtitle {
      color: #64748b;
      font-size: 0.9rem;
      margin-bottom: 1.5rem;
    }

    .pkg-features {
      list-style: none;
      margin-bottom: 2rem;
      flex-grow: 1;
    }

    .pkg-features li {
      margin-bottom: 0.75rem;
      display: flex;
      align-items: center;
      gap: 0.5rem;

      color: #334
